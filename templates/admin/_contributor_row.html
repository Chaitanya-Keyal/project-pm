<tr id="row-{{ c.github_username }}">
    <td>
        <a href="https://github.com/{{ c.github_username }}" target="_blank" rel="noopener">
            {{ c.github_username }}
        </a>
        {% if c.github_username.lower() in merge_authority_logins %}
        <span class="badge badge-maintainer">Maintainer</span>
        {% endif %}
        {% if c.role %}
        <span class="badge badge-role">{{ c.role }}</span>
        {% endif %}
    </td>
    <td class="hide-mobile">
        <span class="stat stat-tier-{{ c.pr_tier }}">{{ c.pr_count }}</span>
    </td>
    <td class="hide-mobile">
        <span class="stat stat-tier-{{ c.review_tier }}">{{ c.review_count }}</span>
    </td>
    <td class="hide-mobile">
        <span class="stat stat-tier-{{ c.review_tier }}">{{ c.comment_count }}</span>
    </td>
    <td class="col-activity">
        <span class="stat stat-tier-{{ c.total_tier }}">{{ c.total_activity }}</span>
    </td>
</tr>
